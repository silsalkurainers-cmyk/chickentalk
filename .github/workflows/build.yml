
name: Build ChickenTalk Portable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify project files
        shell: pwsh
        run: |
          $requiredFiles = @("main.js", "index.html", "package.json")

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required file is missing: $file"
            }
          }

      - name: Install dependencies
        run: npm install

      - name: Build portable executable with retries
        shell: pwsh
        run: |
          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Build attempt $attempt of 3"

            npm run build:windows

            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }

            if ($attempt -lt 3) {
              Write-Host "Build failed. Retrying in 15 seconds..."
              Start-Sleep -Seconds 15
            }
          }

          if (!$success) {
            throw "Build failed after 3 attempts."
          }

      - name: Verify portable executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist" -Filter "ChickenTalk-Portable-*.exe" |
            Select-Object -First 1

          if (!$exe) {
            throw "Portable EXE was not produced."
          }

          Write-Host "Created: $($exe.FullName)"

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ChickenTalk-Portable-Windows
          path: dist/ChickenTalk-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
