
name: Build ChickenTalk Portable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify project files
        shell: pwsh
        run: |
          foreach ($file in @("main.js", "index.html", "package.json")) {
            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        shell: pwsh
        run: |
          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Build attempt $attempt of 3"
            npm run build:windows

            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }

            if ($attempt -lt 3) {
              Start-Sleep -Seconds 15
            }
          }

          if (!$success) {
            throw "Portable EXE build failed after 3 attempts."
          }

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist" -Filter "ChickenTalk-Portable-*.exe" |
            Select-Object -First 1

          if (!$exe) {
            throw "No portable EXE was created."
          }

          if ($exe.Length -lt 1000000) {
            throw "The EXE is unexpectedly small."
          }

          Write-Host "Verified $($exe.Name), $($exe.Length) bytes."

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChickenTalk-Portable-Windows
          path: dist/ChickenTalk-Portable-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
