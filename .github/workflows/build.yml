
name: Build ChickenTalk Portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Show output files
        shell: pwsh
        run: Get-ChildItem dist -Recurse

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChickenTalk-Portable-Windows
          path: dist/*.exe
          if-no-files-found: error
