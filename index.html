
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChickenTalk</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b09;
      --panel: #101713;
      --green: #1d7546;
      --bright: #39b96f;
      --text: #edf5ef;
      --muted: #9aa99e;
      --border: #26382c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #102719, var(--bg) 65%);
      color: var(--text);
      font: 15px Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 420px);
      background: rgba(16, 23, 19, .97);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 24px 80px #0009;
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      background: #17452c;
      border: 1px solid #34764d;
      border-radius: 17px;
      font-size: 29px;
    }

    h1 { margin: 0; font-size: 28px; }
    .subtitle { color: var(--muted); margin-top: 8px; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #080d09;
      padding: 5px;
      border-radius: 10px;
      margin-bottom: 22px;
    }

    button, input { font: inherit; }

    .tabs button {
      border: 0;
      padding: 11px;
      color: var(--muted);
      background: transparent;
      border-radius: 7px;
      cursor: pointer;
    }

    .tabs button.active {
      color: white;
      background: #1d7546;
    }

    label {
      display: block;
      font-size: 13px;
      color: #c9d7cc;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: #090e0b;
      color: white;
      border-radius: 9px;
      padding: 12px;
      outline: none;
    }

    input:focus { border-color: var(--bright); }

    .primary {
      width: 100%;
      border: 0;
      background: var(--green);
      color: white;
      border-radius: 9px;
      padding: 13px;
      margin-top: 22px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary:hover { background: #258b53; }
    .primary:disabled { opacity: .6; cursor: wait; }

    .status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      background: #19271e;
      color: #d8f5df;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .status.error { background: #351b1b; color: #ffcaca; }
    .footnote {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 22px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <header class="brand">
      <div class="logo">🐔</div>
      <h1>ChickenTalk</h1>
      <div class="subtitle">Your flock. Your conversations.</div>
    </header>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Log in</button>
      <button id="signupTab" type="button">Create account</button>
    </div>

    <form id="authForm">
      <div id="usernameField" hidden>
        <label for="username">Username</label>
        <input id="username" name="username"
          minlength="3" maxlength="24"
          pattern="[A-Za-z0-9_]{3,24}"
          placeholder="Chicken username"
          autocomplete="username">
      </div>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        placeholder="you@example.com"
        autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        minlength="8" placeholder="At least 8 characters"
        autocomplete="current-password" required>

      <button class="primary" id="submitButton" type="submit">
        Log in
      </button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <p class="footnote">
      By creating an account, you agree to use ChickenTalk responsibly.
      Keep your password private.
    </p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    // Replace these two values with your Supabase project details.
    const SUPABASE_URL = 'PASTE_YOUR_PROJECT_URL_HERE';
    const SUPABASE_PUBLISHABLE_KEY = 'PASTE_YOUR_PUBLISHABLE_KEY_HERE';

    const statusBox = document.querySelector('#status');
    const form = document.querySelector('#authForm');
    const usernameField = document.querySelector('#usernameField');
    const usernameInput = document.querySelector('#username');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const submitButton = document.querySelector('#submitButton');
    const loginTab = document.querySelector('#loginTab');
    const signupTab = document.querySelector('#signupTab');

    let mode = 'login';
    let supabase = null;

    function showStatus(message, error = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle('error', error);
      statusBox.style.display = 'block';
    }

    function setMode(nextMode) {
      mode = nextMode;
      const signup = mode === 'signup';
      loginTab.classList.toggle('active', !signup);
      signupTab.classList.toggle('active', signup);
      usernameField.hidden = !signup;
      usernameInput.required = signup;
      passwordInput.autocomplete = signup
        ? 'new-password' : 'current-password';
      submitButton.textContent = signup
        ? 'Create account' : 'Log in';
      statusBox.style.display = 'none';
    }

    loginTab.addEventListener('click', () => setMode('login'));
    signupTab.addEventListener('click', () => setMode('signup'));

    if (
      SUPABASE_URL.startsWith('https://') &&
      !SUPABASE_URL.includes('PASTE_') &&
      !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')
    ) {
      supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!supabase) {
        showStatus(
          'Add your Supabase Project URL and publishable key in index.html first.',
          true
        );
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitButton.disabled = true;

      try {
        if (mode === 'signup') {
          const username = usernameInput.value.trim();

          if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
            showStatus(
              'Username must be 3–24 characters using letters, numbers, or underscores.',
              true
            );
            return;
          }

          const { data, error } = await supabase.auth.signUp({
            email,
            password
          });

          if (error) throw error;

          if (data.user && data.session) {
            showStatus(
              'Account created! Username registration still needs the secure backend function before your profile is saved.'
            );
          } else {
            showStatus(
              'Check your email for the confirmation link. Username registration still needs the secure backend function.'
            );
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showStatus(
            'Logged in successfully. The chat interface and profile loading still need to be connected.'
          );
        }
      } catch (error) {
        showStatus(error.message || 'Something went wrong.', true);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
