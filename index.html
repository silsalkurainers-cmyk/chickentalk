
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChickenTalk</title>
<style>
:root {
  --bg: #101310;
  --servers: #0b0e0b;
  --sidebar: #151a16;
  --panel: #1c221d;
  --hover: #28342a;
  --accent: #39794a;
  --accent-hover: #47945a;
  --text: #e5ebe5;
  --muted: #929e93;
  --border: #303a31;
  --danger: #e36c6c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
button, input { font: inherit; }
button { cursor: pointer; }
.app {
  display: grid;
  grid-template-columns: 68px 235px minmax(0,1fr) 215px;
  height: 100vh;
}
.server-rail {
  background: var(--servers);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  overflow-y: auto;
}
.server {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 16px;
  color: #e9f2e9;
  background: #242d25;
  font-size: 19px;
  position: relative;
  transition: .15s;
}
.server:hover { border-radius: 12px; background: var(--accent); }
.server.active { background: var(--accent); border-radius: 12px; }
.server.active::before {
  content: "";
  position: absolute;
  left: -10px;
  top: 9px;
  height: 28px;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: white;
}
.rail-divider { width: 30px; border-top: 1px solid var(--border); }
.add-server { color: #75c58a; font-size: 25px; }
.channel-sidebar {
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  min-width: 0;
  border-right: 1px solid #202720;
}
.server-header {
  padding: 18px 15px;
  font-weight: 750;
  font-size: 17px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 59px;
}
.server-header button, .icon-button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 19px;
}
.server-header button:hover, .icon-button:hover { color: white; }
.channel-scroll { padding: 16px 9px; overflow-y: auto; flex: 1; }
.category {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .7px;
  margin: 12px 5px 7px;
}
.category button {
  border: 0; background: transparent; color: var(--muted); font-size: 18px;
}
.channel {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 5px;
  color: var(--muted);
  cursor: pointer;
  margin: 2px 0;
  font-size: 14px;
}
.channel:hover { background: var(--hover); color: var(--text); }
.channel.active { background: #304735; color: white; }
.channel .hash { font-size: 20px; color: #829184; }
.voice-card {
  padding: 12px;
  margin: 8px;
  border-radius: 8px;
  background: #202820;
  font-size: 12px;
  color: var(--muted);
}
.voice-card strong { display: block; color: #85c994; margin-bottom: 5px; }
.user-panel {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #101410;
  padding: 12px 10px;
}
.avatar {
  width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 50%;
  display: grid; place-items: center;
  color: white; font-weight: 750;
  background: linear-gradient(135deg, #4a8857, #263c2b);
}
.user-details { flex: 1; min-width: 0; }
.user-details strong { display: block; font-size: 13px; }
.user-details small { color: #83c98f; font-size: 11px; }
.user-controls { display: flex; gap: 5px; }
.user-controls button {
  background: transparent; color: var(--muted); border: 0; font-size: 17px;
}
.chat-area { display: flex; flex-direction: column; min-width: 0; }
.chat-header {
  height: 59px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  padding: 0 17px;
}
.chat-header .channel-title { font-weight: 750; }
.chat-header .topic { color: var(--muted); font-size: 12px; margin-left: 8px; }
.header-actions { display: flex; gap: 15px; margin-left: auto; align-items: center; }
.header-actions button {
  color: var(--muted); border: 0; background: transparent; font-size: 18px;
}
.header-actions button:hover { color: white; }
.search {
  background: #111611; border: 1px solid var(--border);
  padding: 7px 10px; border-radius: 5px; color: var(--text);
  width: 145px; outline: none; font-size: 12px;
}
.messages { flex: 1; overflow-y: auto; padding: 20px 22px; }
.welcome {
  padding: 22px 0 18px;
  margin-top: auto;
}
.welcome-icon {
  width: 65px; height: 65px; display: grid; place-items: center;
  background: var(--accent); border-radius: 22px; font-size: 34px;
  margin-bottom: 15px;
}
.welcome h1 { font-size: 26px; margin: 0 0 7px; }
.welcome p { margin: 0; color: var(--muted); font-size: 14px; }
.date-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--muted); font-size: 11px; margin: 25px 0;
}
.date-divider::before, .date-divider::after {
  content: ""; height: 1px; background: var(--border); flex: 1;
}
.message {
  display: flex; gap: 12px; padding: 9px 7px;
  margin: 2px -7px; border-radius: 5px;
}
.message:hover { background: #171d18; }
.message .avatar { width: 39px; height: 39px; }
.message-content { min-width: 0; flex: 1; }
.message-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.message-meta strong { font-size: 14px; }
.message-meta time { color: var(--muted); font-size: 10px; }
.message-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.reactions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.reaction {
  border: 1px solid var(--border); border-radius: 8px;
  background: #202720; color: var(--text); padding: 4px 8px; font-size: 12px;
}
.reaction:hover, .reaction.selected { border-color: var(--accent); background: #29472f; }
.composer-wrap { padding: 0 20px 20px; }
.composer {
  background: #242b25; border-radius: 9px; display: flex;
  align-items: flex-end; gap: 9px; padding: 10px;
}
.composer button {
  background: transparent; color: var(--muted);
  border: 0; font-size: 22px; padding: 3px;
}
.composer button:hover { color: white; }
.composer textarea {
  flex: 1; background: transparent; border: 0; outline: 0;
  resize: none; min-height: 26px; max-height: 140px;
  color: var(--text); font-size: 14px; line-height: 1.5;
}
.composer .send {
  background: var(--accent); color: white; border-radius: 6px;
  padding: 7px 12px; font-size: 13px;
}
.composer .send:hover { background: var(--accent-hover); }
.composer-hint { color: var(--muted); font-size: 10px; margin: 8px 3px 0; }
.members {
  background: var(--sidebar); border-left: 1px solid #202720;
  padding: 20px 12px; overflow-y: auto;
}
.members h3 { color: var(--muted); font-size: 11px; letter-spacing: .5px; margin: 5px 5px 13px; }
.member {
  display: flex; align-items: center; gap: 9px; padding: 7px 5px;
  border-radius: 5px; color: var(--muted); font-size: 13px;
}
.member .avatar { width: 31px; height: 31px; font-size: 12px; }
.member:hover { background: var(--hover); color: white; }
.status-dot {
  width: 9px; height: 9px; border: 2px solid var(--sidebar);
  border-radius: 50%; background: #72c984; margin-left: -17px; margin-top: 22px;
}
.mobile-members { display: none; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #304735; color: white; padding: 12px 18px;
  border-radius: 8px; box-shadow: 0 8px 25px #0008; z-index: 10;
  display: none; font-size: 13px;
}
@media (max-width: 1000px) {
  .app { grid-template-columns: 62px 210px minmax(0,1fr); }
  .members { display: none; }
  .mobile-members { display: inline-block; }
}
@media (max-width: 650px) {
  .app { grid-template-columns: 55px minmax(0,1fr); }
  .channel-sidebar { display: none; }
  .channel-sidebar.mobile-open {
    display: flex; position: fixed; z-index: 5; left: 55px; top: 0; bottom: 0;
    width: 235px; box-shadow: 12px 0 35px #0008;
  }
  .search { display: none; }
  .chat-header { padding: 0 10px; }
  .messages { padding: 12px; }
  .composer-wrap { padding: 0 10px 12px; }
  .chat-header .topic { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="server-rail">
    <button class="server active" title="Home" data-server="Home">🐔</button>
    <div class="rail-divider"></div>
    <button class="server" title="Gaming" data-server="Gaming">🎮</button>
    <button class="server" title="Memes" data-server="Memes">😂</button>
    <button class="server" title="Friends" data-server="Friends">👥</button>
    <button class="server add-server" title="Create server" id="addServer">+</button>
  </aside>

  <aside class="channel-sidebar" id="sidebar">
    <div class="server-header">
      <span id="serverName">ChickenTalk</span>
      <button id="serverMenu" title="Server options">⌄</button>
    </div>
    <div class="channel-scroll" id="channelList"></div>
    <div class="voice-card">
      <strong>● Local mode</strong>
      This is a local demo. Online voice chat isn't connected.
    </div>
    <div class="user-panel">
      <div class="avatar" id="myAvatar">Y</div>
      <div class="user-details">
        <strong id="myName">You</strong>
        <small>Local profile</small>
      </div>
      <div class="user-controls">
        <button id="editProfile" title="Edit profile">⚙</button>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <button class="icon-button mobile-members" id="mobileMenu" title="Channels">☰</button>
      <span style="color:var(--muted);font-size:23px" id="headerHash">#</span>
      <span class="channel-title" id="headerChannel">general</span>
      <span class="topic" id="channelTopic">Welcome to ChickenTalk</span>
      <div class="header-actions">
        <button id="toggleMembers" title="Members">♙</button>
        <input class="search" id="search" placeholder="Search messages..." />
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome">
        <div class="welcome-icon">🐔</div>
        <h1>Welcome to ChickenTalk!</h1>
        <p>This is the beginning of your community. Say hello!</p>
      </div>
      <div class="date-divider">TODAY</div>
      <div id="messageList"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <button id="addAttachment" title="Attachments (demo)">＋</button>
        <textarea id="messageInput" rows="1" placeholder="Message #general"></textarea>
        <button id="emojiButton" title="Insert emoji">☺</button>
        <button class="send" id="sendButton">Send</button>
      </div>
      <div class="composer-hint">Enter to send · Shift + Enter for a new line</div>
    </footer>
  </main>

  <aside class="members" id="members">
    <h3>MEMBERS — <span id="memberCount">1</span></h3>
    <div id="memberList"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const defaultChannels = [
    { name: "general", type: "text", topic: "Welcome to ChickenTalk" },
    { name: "memes", type: "text", topic: "Share your best memes" },
    { name: "gaming", type: "text", topic: "Games, clips, and gaming chat" },
    { name: "clips", type: "text", topic: "Share your favourite clips" },
    { name: "announcements", type: "text", topic: "Community news" },
    { name: "Lounge", type: "voice", topic: "Voice channel demo" }
  ];

  let profile = { name: "You", avatar: "Y" };
  let currentServer = "Home";
  let currentChannel = "general";
  let channels = structuredClone(defaultChannels);
  let customServers = [];
  let messages = {};
  let memberPanelVisible = true;

  try {
    profile = { ...profile, ...JSON.parse(localStorage.getItem("ct-profile") || "{}") };
    channels = JSON.parse(localStorage.getItem("ct-channels") || "null") || channels;
    customServers = JSON.parse(localStorage.getItem("ct-servers") || "[]");
    messages = JSON.parse(localStorage.getItem("ct-messages") || "{}");
  } catch (error) {
    console.warn("Could not load saved ChickenTalk data:", error);
  }

  function save() {
    try {
      localStorage.setItem("ct-profile", JSON.stringify(profile));
      localStorage.setItem("ct-channels", JSON.stringify(channels));
      localStorage.setItem("ct-servers", JSON.stringify(customServers));
      localStorage.setItem("ct-messages", JSON.stringify(messages));
    } catch (error) {
      toast("Could not save locally. Storage may be full.");
    }
  }

  function key() {
    return currentServer + "/" + currentChannel;
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function toast(text) {
    const el = $("toast");
    el.textContent = text;
    el.style.display = "block";
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.style.display = "none", 2600);
  }

  function allServerNames() {
    return ["Home", "Gaming", "Memes", "Friends", ...customServers];
  }

  function drawServers() {
    document.querySelectorAll(".server[data-server]").forEach(button => {
      button.classList.toggle("active", button.dataset.server === currentServer);
    });
  }

  function drawChannels() {
    const list = $("channelList");
    list.replaceChildren();

    const textCategory = document.createElement("div");
    textCategory.className = "category";
    textCategory.innerHTML = '<span>TEXT CHANNELS</span><button title="Create text channel" id="createTextChannel">＋</button>';
    list.appendChild(textCategory);

    channels.filter(c => c.type === "text").forEach(channel => {
      const row = document.createElement("div");
      row.className = "channel" + (channel.name === currentChannel ? " active" : "");
      row.innerHTML = `<span class="hash">#</span><span>${escapeHTML(channel.name)}</span>`;
      row.onclick = () => selectChannel(channel.name);
      list.appendChild(row);
    });

    const voiceCategory = document.createElement("div");
    voiceCategory.className = "category";
    voiceCategory.innerHTML = '<span>VOICE CHANNELS</span><button title="Create voice channel" id="createVoiceChannel">＋</button>';
    list.appendChild(voiceCategory);

    channels.filter(c => c.type === "voice").forEach(channel => {
      const row = document.createElement("div");
      row.className = "channel" + (channel.name === currentChannel ? " active" : "");
      row.innerHTML = `<span>🔊</span><span>${escapeHTML(channel.name)}</span>`;
      row.onclick = () => selectChannel(channel.name);
      list.appendChild(row);
    });

    $("createTextChannel").onclick = () => createChannel("text");
    $("createVoiceChannel").onclick = () => createChannel("voice");
    $("serverName").textContent = currentServer === "Home" ? "ChickenTalk" : currentServer;
  }

  function selectChannel(name) {
    currentChannel = name;
    const channel = channels.find(c => c.name === name);
    if (!channel) return;
    $("headerChannel").textContent = name;
    $("headerHash").textContent = channel.type === "voice" ? "🔊" : "#";
    $("channelTopic").textContent = channel.topic || "";
    $("messageInput").placeholder = channel.type === "voice"
      ? "Voice channels aren't connected yet"
      : `Message #${name}`;
    $("messageInput").disabled = channel.type === "voice";
    $("sendButton").disabled = channel.type === "voice";
    $("sendButton").style.opacity = channel.type === "voice" ? ".45" : "1";
    drawChannels();
    renderMessages();
    $("sidebar").classList.remove("mobile-open");
  }

  function createChannel(type) {
    const name = prompt(`Name your ${type === "text" ? "text" : "voice"} channel:`);
    if (!name || !name.trim()) return;
    const cleanName = name.trim().toLowerCase().replace(/[^a-z0-9-_ ]/g, "").replace(/\s+/g, "-").slice(0, 40);
    if (!cleanName) return toast("Please choose a valid channel name.");
    if (channels.some(c => c.name === cleanName)) return toast("That channel already exists.");
    channels.push({
      name: cleanName,
      type,
      topic: type === "text" ? "A new ChickenTalk channel" : "Voice channel demo"
    });
    currentChannel = cleanName;
    save();
    drawChannels();
    selectChannel(cleanName);
    toast("Channel created.");
  }

  function renderMessages(filter = "") {
    const list = $("messageList");
    list.replaceChildren();
    const channelMessages = messages[key()] || [];
    const filtered = channelMessages.filter(m =>
      m.text.toLowerCase().includes(filter.toLowerCase()) ||
      m.author.toLowerCase().includes(filter.toLowerCase())
    );

    if (!filtered.length && !filter) {
      const empty = document.createElement("div");
      empty.style.cssText = "color:var(--muted);font-size:13px;padding:8px 0 20px";
      empty.textContent = "No messages here yet. Start the conversation!";
      list.appendChild(empty);
    } else if (!filtered.length) {
      const empty = document.createElement("div");
      empty.style.cssText = "color:var(--muted);padding:15px";
      empty.textContent = "No matching messages.";
      list.appendChild(empty);
    }

    filtered.forEach(message => {
      const row = document.createElement("article");
      row.className = "message";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = message.avatar || "?";

      const content = document.createElement("div");
      content.className = "message-content";
      const meta = document.createElement("div");
      meta.className = "message-meta";
      const author = document.createElement("strong");
      author.textContent = message.author;
      const time = document.createElement("time");
      time.textContent = message.time;
      meta.append(author, time);

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = message.text;

      const reactions = document.createElement("div");
      reactions.className = "reactions";
      const currentReactions = message.reactions || {};
      ["👍", "😂", "🔥"].forEach(emoji => {
        const button = document.createElement("button");
        button.className = "reaction" + (currentReactions[emoji] ? " selected" : "");
        button.textContent = emoji + (currentReactions[emoji] ? " 1" : "");
        button.onclick = () => {
          message.reactions ||= {};
          message.reactions[emoji] = !message.reactions[emoji];
          save();
          renderMessages($("search").value);
        };
        reactions.appendChild(button);
      });

      content.append(meta, text, reactions);
      row.append(avatar, content);
      list.appendChild(row);
    });
  }

  function sendMessage() {
    const input = $("messageInput");
    const text = input.value.trim();
    if (!text || input.disabled) return;

    messages[key()] ||= [];
    messages[key()].push({
      author: profile.name,
      avatar: profile.avatar,
      text,
      time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      reactions: {}
    });
    input.value = "";
    input.style.height = "26px";
    save();
    renderMessages($("search").value);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function drawMembers() {
    const list = $("memberList");
    list.replaceChildren();
    const member = document.createElement("div");
    member.className = "member";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = profile.avatar;
    const dot = document.createElement("span");
    dot.className = "status-dot";
    const name = document.createElement("span");
    name.textContent = profile.name + " (you)";
    member.append(avatar, dot, name);
    list.appendChild(member);
    $("memberCount").textContent = "1";
  }

  function switchServer(name) {
    currentServer = name;
    currentChannel = "general";
    if (!channels.some(c => c.name === currentChannel)) {
      currentChannel = channels.find(c => c.type === "text")?.name || channels[0]?.name;
    }
    drawServers();
    drawChannels();
    selectChannel(currentChannel);
  }

  document.querySelectorAll(".server[data-server]").forEach(button => {
    button.addEventListener("click", () => switchServer(button.dataset.server));
  });

  $("addServer").onclick = () => {
    const name = prompt("Name your new server:");
    if (!name || !name.trim()) return;
    const clean = name.trim().slice(0, 32);
    if (allServerNames().some(n => n.toLowerCase() === clean.toLowerCase())) {
      return toast("A server with that name already exists.");
    }
    customServers.push(clean);
    save();

    const button = document.createElement("button");
    button.className = "server";
    button.title = clean;
    button.textContent = clean.slice(0, 2).toUpperCase();
    button.dataset.server = clean;
    button.onclick = () => switchServer(clean);
    $("addServer").before(button);
    switchServer(clean);
    toast("Server created locally.");
  };

  $("serverMenu").onclick = () => {
    const action = prompt("Server options:\n1. Rename this server\n2. Create a channel\n3. Cancel", "3");
    if (action === "1") {
      const name = prompt("New server name:", currentServer === "Home" ? "ChickenTalk" : currentServer);
      if (!name || !name.trim()) return;
      if (currentServer === "Home") $("serverName").textContent = name.trim();
      else {
        customServers = customServers.map(s => s === currentServer ? name.trim() : s);
        currentServer = name.trim();
        save();
        drawServers();
      }
      $("serverName").textContent = name.trim();
    } else if (action === "2") {
      createChannel("text");
    }
  };

  $("sendButton").onclick = sendMessage;
  $("messageInput").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
  $("messageInput").addEventListener("input", event => {
    event.target.style.height = "26px";
    event.target.style.height = Math.min(event.target.scrollHeight, 140) + "px";
  });
  $("search").addEventListener("input", event => renderMessages(event.target.value));

  $("editProfile").onclick = () => {
    const name = prompt("Your display name:", profile.name);
    if (!name || !name.trim()) return;
    profile.name = name.trim().slice(0, 32);
    const avatar = prompt("Choose one letter or emoji for your avatar:", profile.avatar);
    if (avatar && avatar.trim()) profile.avatar = avatar.trim().slice(0, 3);
    $("myName").textContent = profile.name;
    $("myAvatar").textContent = profile.avatar;
    drawMembers();
    save();
    toast("Profile updated on this device.");
  };

  $("emojiButton").onclick = () => {
    const emoji = prompt("Enter an emoji to insert:", "🐔");
    if (!emoji) return;
    const input = $("messageInput");
    input.value += emoji;
    input.focus();
  };

  $("addAttachment").onclick = () => toast("File attachments will be added in a later version.");

  $("toggleMembers").onclick = () => {
    memberPanelVisible = !memberPanelVisible;
    $("members").style.display = memberPanelVisible ? "" : "none";
  };

  $("mobileMenu").onclick = () => $("sidebar").classList.toggle("mobile-open");

  $("serverName").textContent = "ChickenTalk";
  $("myName").textContent = profile.name;
  $("myAvatar").textContent = profile.avatar;
  drawServers();
  drawChannels();
  drawMembers();
  selectChannel(currentChannel);
})();
</script>
</body>
</html>
